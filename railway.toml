[build]
builder = "NIXPACKS"
watchPatterns = [
  "/railway.toml",
  "/nixpacks.toml",
  "/requirements.txt",
  "/runtime.txt",
  "/manage.py",
  "/build.sh",
  "/sales_project/**",
  "/reporting/**",
  "/todos/**",
  "/ai_chat/**",
  "/theme/**",
  "/static/**"
]
# `/frontend/**`는 일부러 빼 둔다. web 이미지도 SPA(frontend/dist)를 서빙하지만,
# 프론트만 바뀐 커밋까지 web을 재빌드하면 무거운 이미지(libreoffice·node·npm ci·
# vite build)를 다시 만들고 프로덕션 Django를 재시작(+migrate 재실행)하게 된다.
# 백엔드가 그대로인 동안 web이 이전 SPA를 들고 있는 건 "직전 릴리스" 조합이라
# 그 자체로 정상 동작하고, 백엔드가 바뀌는 순간 web이 재빌드되며 최신 SPA를
# 같이 가져간다. 사용자 진입점은 sales-note-frontend 서비스다.

[deploy]
startCommand = "python manage.py migrate && gunicorn sales_project.wsgi:application --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --threads 4"
healthcheckPath = "/healthz/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
