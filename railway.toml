[build]
builder = "NIXPACKS"
watchPatterns = [
  "/railway.toml",
  "/nixpacks.toml",
  "/requirements.txt",
  "/runtime.txt",
  "/manage.py",
  "/build.sh",
  "/sales_project/**",
  "/reporting/**",
  "/todos/**",
  "/ai_chat/**",
  "/theme/**",
  "/static/**",
  # 2026-08-16 에 빌드 비용을 아끼려고 뺐다가 되돌린다. 뺄 당시엔 사용자 진입점이
  # 별도 `sales-note-frontend` 서비스여서 web 의 SPA 사본이 낡아도 괜찮았는데,
  # 같은 날 그 서비스를 삭제해 지금은 **web 이 SPA 를 서빙하는 유일한 곳**이다.
  # 이 패턴이 빠져 있으면 프론트만 고친 커밋은 빌드가 아예 안 돌아 사용자에게
  # 영원히 반영되지 않는다. 서비스가 하나뿐이라 "중복 빌드" 문제도 이제 없다.
  "/frontend/**"
]

[deploy]
startCommand = "python manage.py migrate && gunicorn sales_project.wsgi:application --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --threads 4"
healthcheckPath = "/healthz/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
